general:
  experiment_name: A3_rf
  seed: 1027309
  mode: train
data:
  target: Survived
  id_column: PassengerId
  drop_columns: [Ticket, Cabin]
preprocessing:
  numeric_imputer: mean
  categorical_imputer: most_frequent
  scale_numeric: true
  encode_categorical: true
feature_engineering:
  enabled: true
  feature: Title
split:
  n_splits: 5
  shuffle: true
model:
  name: RandomForestClassifier
  params:
    n_estimators: 350
    max_depth: 6
    min_samples_split: 18
    min_samples_leaf: 4
    max_features: null
    random_state: 1027309
    n_jobs: -1
metric:
  name: accuracy_score
